apiVersion: v1
kind: Service
metadata:
  name: devops-web-service
  namespace: default
  labels:
    app: devops-web-app
    tier: frontend
    environment: production
    managed-by: argocd
spec:
  type: NodePort
  selector:
    app: devops-web-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
