apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-app
  namespace: default
  labels:
    app: devops-web-app
    tier: frontend
    environment: production
    managed-by: argocd
spec:
  replicas: 5
  selector:
    matchLabels:
      app: devops-web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-web-app
        tier: frontend
        environment: production
    spec:
      containers:
      - name: web-app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
